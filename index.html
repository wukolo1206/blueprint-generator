<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雙向細目表產生器</title>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
  <script src="https://unpkg.com/docxtemplater@3.37.12/build/docxtemplater.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Noto Sans TC", Arial, sans-serif; background: #f5f6f8; color: #202124; margin: 0; }
    .shell { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #5f6368; font-size: 13px; margin: 0 0 20px; }
    .panel { background: #fff; border: 1px solid #dde1e7; border-radius: 8px; margin: 14px 0; padding: 18px; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    textarea { border: 1px solid #c7cdd4; border-radius: 6px; font: 13px/1.5 monospace; padding: 10px; resize: vertical; width: 100%; min-height: 200px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .field { display: flex; flex-direction: column; flex: 1 1 180px; gap: 4px; }
    .field label { font-size: 12px; color: #5f6368; }
    .field input { border: 1px solid #c7cdd4; border-radius: 6px; font: inherit; padding: 7px 10px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    button { background: #1a73e8; border: none; border-radius: 6px; color: #fff; cursor: pointer; font: inherit; font-size: 14px; padding: 9px 16px; }
    button.sec { background: #5f6368; }
    button.dl  { background: #188038; }
    .warn  { background: #fff4ce; border-radius: 6px; color: #5f4700; font-size: 13px; margin: 6px 0; padding: 8px 12px; }
    .errmsg{ background: #fce8e6; border-radius: 6px; color: #a50e0e; font-size: 13px; margin: 6px 0; padding: 8px 12px; }
    table { border-collapse: collapse; font-size: 12px; width: 100%; margin-top: 8px; overflow-x: auto; display: block; }
    th, td { border: 1px solid #d7dce2; padding: 4px 6px; vertical-align: top; white-space: nowrap; }
    th { background: #f0f3f8; font-weight: 600; text-align: center; }
    td input { border: none; font: inherit; padding: 2px 4px; width: 100%; min-width: 60px; }
    td input:focus { outline: 2px solid #1a73e8; border-radius: 3px; }
  </style>
</head>
<body>
<div class="shell">
  <h1>雙向細目表產生器</h1>
  <p class="sub">新北市五股區更寮國小 &mdash; 定期評量雙向細目表快速產生工具</p>

  <div class="panel" style="background:#eef4ff;border-color:#b8d0f5">
    <h2 style="color:#1a56c4">&#128203; 使用步驟</h2>
    <ol style="margin:0 0 12px;padding-left:20px;line-height:2.2;font-size:14px">
      <li>上傳考卷與教師手冊到
        <a href="https://gemini.google.com/gem/1genZSp6mDauYm52VDS3zYC2obys6tU3f?usp=sharing"
           target="_blank" rel="noopener"
           style="color:#1a56c4;font-weight:bold">&#x1F916;&nbsp;Gemini 雙向細目表 Gem</a>，
        由 AI 分析產生 Markdown 表格
      </li>
      <li>將 Gemini 產出的內容（第一部分＋第二部分）完整複製，貼入下方文字框</li>
      <li>點「解析並預覽」，確認並填寫科目、年級、命題教師、版本</li>
      <li>點「下載 DOCX」&rarr; 列印 &rarr; 手動簽名 &rarr; 掃描成 PDF 上傳</li>
    </ol>
    <p style="margin:0;font-size:12px;color:#5f6368">
      &#9432; 若數字有誤，可在預覽表格中直接點格子修改後再下載
    </p>
  </div>

  <div class="panel">
    <h2>貼入 Gemini 產出內容</h2>
    <textarea id="sourceInput" placeholder="貼上 Gemini 產出的 Markdown 雙向細目表（第一部分＋第二部分）…"></textarea>
    <div class="actions">
      <button id="parseBtn">解析並預覽</button>
      <button class="sec" id="exampleBtn">載入範例</button>
    </div>
  </div>

  <div class="panel" id="previewPanel" hidden>
    <h2>基本資料</h2>
    <div class="row">
      <div class="field"><label>科目</label><input id="subject" placeholder="社會"></div>
      <div class="field"><label>使用年級</label><input id="grade" placeholder="三年級"></div>
      <div class="field"><label>命題教師</label><input id="teacher"></div>
      <div class="field"><label>版本</label><input id="version" placeholder="翰林"></div>
    </div>
    <div id="messages"></div>
    <h2 style="margin-top:16px">表格一：總覽</h2>
    <div id="overviewEditor" style="overflow-x:auto"></div>
    <h2 style="margin-top:16px">表格二：詳細分析</h2>
    <div id="detailEditor" style="overflow-x:auto"></div>
    <div class="actions" style="margin-top:16px">
      <button class="dl" id="downloadBtn">下載 DOCX</button>
    </div>
  </div>
</div>

function Parser_parsePayload(payload) {
  if (!payload) {
    throw new Error('請貼上要解析的內容。');
  }
  if (payload.inputType === 'items') {
    return Aggregator_fromItemText(payload);
  }
  if (!payload.sourceText) {
    throw new Error('請貼上要解析的內容。');
  }

  var tables = Parser_parseMarkdownTables_(payload.sourceText);
  if (tables.length < 1) {
    throw new Error('找不到 Markdown 表格。請確認內容包含以 | 分隔的表格。');
  }

  var overviewTable = Parser_findTable_(tables, ['教學目標', '上課節數', '實際配分']);
  var detailTable = Parser_findTable_(tables, ['試題型式', '記憶', '了解', '應用']);
  if (!overviewTable) {
    throw new Error('找不到第一部分總覽表。');
  }
  if (!detailTable) {
    throw new Error('找不到第二部分詳細分析表。');
  }

  return {
    meta: {
      mode: payload.mode || 'unit',
      subject: '',
      grade: '',
      teacher: '',
      publisherVersion: '',
      examTitle: ''
    },
    overviewRows: Parser_overviewRowsFromTable_(overviewTable),
    detailRows: Parser_detailRowsFromTable_(detailTable),
    reviewChecks: Parser_defaultReviewChecks_()
  };
}

function Parser_parseMarkdownTables_(sourceText) {
  var lines = String(sourceText == null ? '' : sourceText).split(/\r?\n/);
  var tables = [];
  var current = [];
  for (var i = 0; i < lines.length; i += 1) {
    var line = lines[i].trim();
    if (line.indexOf('|') !== -1) {
      current.push(line);
    } else if (line === '') {
      // 略過空行（Gemini 有時在儲存格內插入空行）
    } else if (current.length) {
      Parser_pushTable_(tables, current);
      current = [];
    }
  }
  if (current.length) {
    Parser_pushTable_(tables, current);
  }
  return tables;
}

function Parser_pushTable_(tables, lines) {
  var rows = [];
  for (var i = 0; i < lines.length; i += 1) {
    var cells = Parser_splitRow_(lines[i]);
    if (!Parser_isSeparatorRow_(cells)) {
      rows.push(cells);
    }
  }
  if (rows.length) {
    tables.push(rows);
  }
}

function Parser_splitRow_(line) {
  var text = String(line == null ? '' : line).trim();
  if (text.charAt(0) === '|') {
    text = text.slice(1);
  }
  if (text.charAt(text.length - 1) === '|') {
    text = text.slice(0, -1);
  }
  return text.split('|').map(function (cell) {
    return Parser_cleanCell_(cell);
  });
}

function Parser_isSeparatorRow_(cells) {
  return cells.length > 0 && cells.every(function (cell) {
    return /^:?-{3,}:?$/.test(Parser_cleanCell_(cell));
  });
}

function Parser_cleanCell_(value) {
  return String(value == null ? '' : value)
    .replace(/\u00a0/g, ' ')
    .replace(/&nbsp;/gi, ' ')
    .replace(/\*\*/g, '')
    .replace(/<br\s*\/?>/gi, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function Parser_findTable_(tables, requiredHeaders) {
  for (var i = 0; i < tables.length; i += 1) {
    var header = tables[i][0].join(' ');
    var matched = requiredHeaders.every(function (required) {
      return header.indexOf(required) !== -1;
    });
    if (matched) {
      return tables[i];
    }
  }
  return null;
}

function Parser_overviewRowsFromTable_(table) {
  var rows = [];
  for (var i = 1; i < table.length; i += 1) {
    var row = table[i];
    if (!row.join('').trim()) {
      continue;
    }
    var firstCell = (row[0] || '').trim();
    if (rows.length > 0 && /^\d+(\.\d+)?$/.test(firstCell)) {
      var prev = rows[rows.length - 1];
      if (!prev.periods)    { prev.periods    = Parser_number_(row[0]); }
      if (!prev.idealScore) { prev.idealScore = Parser_number_(row[1]); }
      if (!prev.actualScore){ prev.actualScore= Parser_number_(row[2]); }
      continue;
    }
    rows.push({
      contentName: row[0] || '',
      teachingGoal: row[1] || '',
      periods: Parser_number_(row[2]),
      idealScore: Parser_number_(row[3]),
      actualScore: Parser_number_(row[4])
    });
  }
  return rows;
}

function Parser_detailRowsFromTable_(table) {
  var schema = Parser_detailHeaderSchema_(table[0] || []);
  if (!schema) {
    throw new Error('第二部分詳細分析表欄位格式不支援，請使用「記憶題數/記憶配分」分欄格式，或「記憶」欄填 2(4) 的合併格式。');
  }
  var rows = [];
  for (var i = 1; i < table.length; i += 1) {
    var row = table[i];
    if (!row.join('').trim()) {
      continue;
    }
    var memory = Parser_detailPairFromRow_(row, schema.memory);
    var understand = Parser_detailPairFromRow_(row, schema.understand);
    var apply = Parser_detailPairFromRow_(row, schema.apply);
    var higher = Parser_detailPairFromRow_(row, schema.higher);
    var subtotal = Parser_detailPairFromRow_(row, schema.subtotal);
    rows.push({
      contentName: row[schema.contentName] || '',
      questionType: row[schema.questionType] || '',
      memoryCount: memory.count,
      memoryScore: memory.score,
      understandCount: understand.count,
      understandScore: understand.score,
      applyCount: apply.count,
      applyScore: apply.score,
      higherCount: higher.count,
      higherScore: higher.score,
      subtotalCount: subtotal.count,
      subtotalScore: subtotal.score,
      rowKind: Parser_detailRowKind_(row, schema)
    });
  }
  return rows;
}

function Parser_detailHeaderSchema_(header) {
  var contentName = Parser_headerIndex_(header, ['教材內容單元名稱']);
  var questionType = Parser_headerIndex_(header, ['試題型式']);
  if (contentName === -1 || questionType === -1) {
    return null;
  }

  var separate = {
    contentName: contentName,
    questionType: questionType,
    memory: Parser_detailSeparatePair_(header, '記憶'),
    understand: Parser_detailSeparatePair_(header, '了解'),
    apply: Parser_detailSeparatePair_(header, '應用'),
    higher: Parser_detailSeparatePair_(header, '高層次思考'),
    subtotal: {
      countIndex: Parser_headerIndex_(header, ['試題型式小計題數']),
      scoreIndex: Parser_headerIndex_(header, ['試題型式小計配分'])
    }
  };
  if (Parser_detailSchemaComplete_(separate)) {
    return separate;
  }

  var compact = {
    contentName: contentName,
    questionType: questionType,
    memory: Parser_detailCompactPair_(header, '記憶'),
    understand: Parser_detailCompactPair_(header, '了解'),
    apply: Parser_detailCompactPair_(header, '應用'),
    higher: Parser_detailCompactPair_(header, '高層次思考'),
    subtotal: Parser_detailCompactPair_(header, '試題型式小計')
  };
  if (Parser_detailSchemaComplete_(compact)) {
    return compact;
  }

  return null;
}

function Parser_detailSeparatePair_(header, label) {
  return {
    countIndex: Parser_headerIndex_(header, [label + '題數']),
    scoreIndex: Parser_headerIndex_(header, [label + '配分'])
  };
}

function Parser_detailCompactPair_(header, label) {
  return {
    countIndex: Parser_headerIndex_(header, [label]),
    scoreIndex: -1,
    compact: true
  };
}

function Parser_detailSchemaComplete_(schema) {
  return Parser_detailPairComplete_(schema.memory) &&
    Parser_detailPairComplete_(schema.understand) &&
    Parser_detailPairComplete_(schema.apply) &&
    Parser_detailPairComplete_(schema.higher) &&
    Parser_detailPairComplete_(schema.subtotal);
}

function Parser_detailPairComplete_(pair) {
  return pair.countIndex !== -1 && (pair.compact || pair.scoreIndex !== -1);
}

function Parser_detailPairFromRow_(row, pair) {
  return Parser_countScorePair_(row[pair.countIndex], pair.scoreIndex === -1 ? '' : row[pair.scoreIndex]);
}

function Parser_headerIndex_(header, candidates) {
  for (var i = 0; i < header.length; i += 1) {
    var value = Parser_headerKey_(header[i]);
    for (var j = 0; j < candidates.length; j += 1) {
      if (value === Parser_headerKey_(candidates[j])) {
        return i;
      }
    }
  }
  return -1;
}

function Parser_headerKey_(value) {
  return Parser_cleanCell_(value)
    .replace(/[()（）]/g, '')
    .replace(/\s+/g, '');
}

function Parser_countScorePair_(countCell, scoreCell) {
  var compact = Parser_cleanCell_(countCell).match(/^(-?\d+(?:\.\d+)?)\s*[\(（]\s*(-?\d+(?:\.\d+)?)\s*[\)）]$/);
  if (compact) {
    return {
      count: Parser_number_(compact[1]),
      score: Parser_number_(compact[2])
    };
  }
  return {
    count: Parser_number_(countCell),
    score: Parser_number_(scoreCell)
  };
}

function Parser_detailRowKind_(row, schema) {
  var contentName = row[schema.contentName] || '';
  var questionType = row[schema.questionType] || '';
  if (contentName.indexOf('全卷總計') !== -1 || contentName.indexOf('全卷合計') !== -1) {
    return 'examTotal';
  }
  if (questionType.indexOf('單元合計') !== -1 || questionType.indexOf('課別合計') !== -1) {
    return 'contentTotal';
  }
  return 'detail';
}

function Parser_number_(value) {
  var text = Parser_cleanCell_(value)
    .replace(/[()（）]/g, '')
    .replace(/,/g, '');
  if (!text) {
    return 0;
  }
  var number = Number(text);
  return Number.isFinite(number) ? number : 0;
}

function Parser_defaultReviewChecks_() {
  var items = [];
  for (var i = 1; i <= 21; i += 1) {
    items.push(true);
  }
  return {
    noPublisherCopy: true,
    noOtherSchoolOrOldExamCopy: true,
    avoidanceRule: true,
    selfCheckItems: items
  };
}

function Aggregator_fromItemText(payload) {
  var mode = payload && payload.mode ? payload.mode : 'unit';
  var items = Aggregator_parseItems_(payload && payload.sourceText);
  var contentOrder = Aggregator_unique_(items.map(function (item) {
    return item.contentName;
  }));
  var overviewRows = [];
  var idealScores = Aggregator_idealScores_(contentOrder.length);

  for (var i = 0; i < contentOrder.length; i += 1) {
    var contentName = contentOrder[i];
    var contentItems = items.filter(function (item) {
      return item.contentName === contentName;
    });
    overviewRows.push({
      contentName: contentName,
      teachingGoal: contentItems[0] ? contentItems[0].teachingGoal : '',
      periods: contentItems[0] ? contentItems[0].periods : 0,
      idealScore: idealScores[i],
      actualScore: Aggregator_sum_(contentItems, 'score')
    });
  }

  overviewRows.push({
    contentName: '合計',
    teachingGoal: '',
    periods: Aggregator_sum_(overviewRows, 'periods'),
    idealScore: 100,
    actualScore: Aggregator_sum_(items, 'score')
  });

  return {
    meta: {
      mode: mode,
      subject: '',
      grade: '',
      teacher: '',
      publisherVersion: '',
      examTitle: ''
    },
    overviewRows: overviewRows,
    detailRows: Aggregator_detailRows_(items, contentOrder, mode),
    reviewChecks: Parser_defaultReviewChecks_()
  };
}

function Aggregator_parseItems_(sourceText) {
  var rows = Aggregator_parseCsv_(sourceText);
  rows = rows.filter(function (row) {
    return row.join('').trim() !== '';
  });
  if (!rows.length) {
    throw new Error('缺少題目資料，請貼上含標題列的 CSV。');
  }

  var header = rows[0];
  var indexes = Aggregator_headerIndexes_(header);
  var items = [];
  for (var i = 1; i < rows.length; i += 1) {
    var row = rows[i];
    if (!row.join('').trim()) {
      continue;
    }
    var contentName = Aggregator_cell_(row, indexes.contentName);
    if (!contentName) {
      continue;
    }
    var questionType = Aggregator_cell_(row, indexes.questionType);
    if (!questionType) {
      throw new Error('第 ' + row.lineNumber + ' 列試題型式不可空白');
    }
    var cognition = Aggregator_normalizeCognition_(Aggregator_cell_(row, indexes.cognition), row.lineNumber);
    items.push({
      contentName: contentName,
      teachingGoal: Aggregator_cell_(row, indexes.teachingGoal),
      periods: Aggregator_strictNumber_(Aggregator_cell_(row, indexes.periods), row.lineNumber, '上課節數'),
      questionType: questionType,
      cognition: cognition,
      score: Aggregator_strictNumber_(Aggregator_cell_(row, indexes.score), row.lineNumber, '配分'),
      rowNumber: row.lineNumber
    });
  }

  if (!items.length) {
    throw new Error('沒有可彙整的題目資料，請確認至少一列有單元/課別與題目資訊。');
  }
  return items;
}

function Aggregator_parseCsv_(sourceText) {
  var text = String(sourceText == null ? '' : sourceText).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  var rows = [];
  var row = [];
  var current = '';
  var quoted = false;
  var lineNumber = 1;
  var rowStartLine = 1;

  for (var i = 0; i < text.length; i += 1) {
    var ch = text.charAt(i);
    if (ch === '"') {
      if (quoted && text.charAt(i + 1) === '"') {
        current += '"';
        i += 1;
      } else {
        quoted = !quoted;
      }
    } else if (ch === ',' && !quoted) {
      row.push(current.trim());
      current = '';
    } else if (ch === '\n') {
      if (quoted) {
        current += ch;
      } else {
        row.push(current.trim());
        row.lineNumber = rowStartLine;
        rows.push(row);
        row = [];
        current = '';
        rowStartLine = lineNumber + 1;
      }
      lineNumber += 1;
    } else {
      current += ch;
    }
  }

  if (quoted) {
    throw new Error('CSV 引號未結束：第 ' + rowStartLine + ' 列開始的資料缺少結尾引號。');
  }

  if (current !== '' || row.length || text.length) {
    row.push(current.trim());
    row.lineNumber = rowStartLine;
    rows.push(row);
  }
  return rows;
}

function Aggregator_splitCsvLine_(line) {
  var rows = Aggregator_parseCsv_(line);
  return rows[0] || [];
}

function Aggregator_headerIndexes_(header) {
  var specs = [
    { key: 'contentName', label: '單元名稱', names: ['單元名稱', '課別', '教材內容'] },
    { key: 'teachingGoal', label: '教學目標', names: ['教學目標', '單元目標'] },
    { key: 'periods', label: '上課節數', names: ['上課節數', '節數'] },
    { key: 'questionType', label: '試題型式', names: ['試題型式', '題型'] },
    { key: 'cognition', label: '認知層次', names: ['認知層次'] },
    { key: 'score', label: '配分', names: ['配分', '分數'] }
  ];
  var indexes = {};
  for (var i = 0; i < specs.length; i += 1) {
    var spec = specs[i];
    indexes[spec.key] = Aggregator_findHeader_(header, spec.names);
    if (indexes[spec.key] < 0) {
      throw new Error('缺少欄位：' + spec.label);
    }
  }
  return indexes;
}

function Aggregator_findHeader_(header, names) {
  for (var i = 0; i < header.length; i += 1) {
    var value = Aggregator_normalizeText_(header[i]);
    for (var j = 0; j < names.length; j += 1) {
      if (value === Aggregator_normalizeText_(names[j])) {
        return i;
      }
    }
  }
  return -1;
}

function Aggregator_cell_(row, index) {
  return String(row[index] == null ? '' : row[index]).trim();
}

function Aggregator_strictNumber_(value, rowNumber, fieldName) {
  var original = String(value == null ? '' : value).trim();
  if (!/^\d+(?:\.\d+)?$/.test(original)) {
    throw new Error('第 ' + rowNumber + ' 列' + fieldName + '不是有效數字：' + original);
  }
  return Number(original);
}

function Aggregator_normalizeText_(value) {
  return String(value == null ? '' : value).replace(/\s+/g, '');
}

function Aggregator_normalizeCognition_(value, rowNumber) {
  var original = String(value == null ? '' : value).trim();
  var normalized = Aggregator_normalizeText_(original);
  if (normalized === '記憶') {
    return '記憶';
  }
  if (normalized === '了解' || normalized === '理解') {
    return '了解';
  }
  if (normalized === '應用') {
    return '應用';
  }
  if (normalized === '高層次思考' || normalized === '高層次') {
    return '高層次思考';
  }
  throw new Error('第 ' + rowNumber + ' 列未知認知層次：' + original);
}

function Aggregator_idealScores_(count) {
  var scores = [];
  var subtotal = 0;
  for (var i = 0; i < count; i += 1) {
    var score = i === count - 1 ? 100 - subtotal : Math.round((100 / count) * 10) / 10;
    score = Math.round(score * 10) / 10;
    scores.push(score);
    subtotal += score;
  }
  return scores;
}

function Aggregator_detailRows_(items, contentOrder, mode) {
  var rows = [];
  var totalLabel = mode === 'lesson' ? '課別合計' : '單元合計';
  for (var i = 0; i < contentOrder.length; i += 1) {
    var contentName = contentOrder[i];
    var contentItems = items.filter(function (item) {
      return item.contentName === contentName;
    });
    var questionTypes = Aggregator_unique_(contentItems.map(function (item) {
      return item.questionType;
    }));
    for (var j = 0; j < questionTypes.length; j += 1) {
      var questionType = questionTypes[j];
      rows.push(Aggregator_buildDetailRow_(contentName, questionType, contentItems.filter(function (item) {
        return item.questionType === questionType;
      }), 'detail'));
    }
    rows.push(Aggregator_buildDetailRow_('', totalLabel, contentItems, 'contentTotal'));
  }
  rows.push(Aggregator_buildDetailRow_('合計', '', items, 'examTotal'));
  return rows;
}

function Aggregator_buildDetailRow_(contentName, questionType, items, rowKind) {
  var row = {
    contentName: contentName,
    questionType: questionType,
    memoryCount: 0,
    memoryScore: 0,
    understandCount: 0,
    understandScore: 0,
    applyCount: 0,
    applyScore: 0,
    higherCount: 0,
    higherScore: 0,
    subtotalCount: items.length,
    subtotalScore: Aggregator_sum_(items, 'score'),
    rowKind: rowKind
  };

  for (var i = 0; i < items.length; i += 1) {
    var cognition = items[i].cognition;
    var score = items[i].score;
    if (cognition === '記憶') {
      row.memoryCount += 1;
      row.memoryScore += score;
    } else if (cognition === '了解') {
      row.understandCount += 1;
      row.understandScore += score;
    } else if (cognition === '應用') {
      row.applyCount += 1;
      row.applyScore += score;
    } else if (cognition === '高層次思考') {
      row.higherCount += 1;
      row.higherScore += score;
    } else {
      throw new Error('第 ' + items[i].rowNumber + ' 列未知認知層次：' + cognition);
    }
  }
  return row;
}

function Aggregator_unique_(values) {
  var seen = {};
  var result = [];
  for (var i = 0; i < values.length; i += 1) {
    var value = values[i];
    if (value == null || value === '' || seen[value]) {
      continue;
    }
    seen[value] = true;
    result.push(value);
  }
  return result;
}

function Aggregator_sum_(rows, key) {
  var total = 0;
  for (var i = 0; i < rows.length; i += 1) {
    total += Parser_number_(rows[i] && rows[i][key]);
  }
  return total;
}

function Validator_validateWorkbook(workbook) {
  var state = {
    canGenerate: true,
    messages: []
  };

  if (!workbook) {
    Validator_block_(state, '缺少工作簿資料，請先解析或匯入雙向細目表。');
    return state;
  }

  var overviewState = Validator_checkOverviewRows_(state, workbook.overviewRows);
  var detailState = Validator_checkDetailRows_(state, workbook.detailRows);
  Validator_checkCrossTotals_(state, overviewState, detailState);

  return state;
}

function Validator_checkOverviewRows_(state, overviewRows) {
  if (!Array.isArray(overviewRows) || overviewRows.length === 0) {
    Validator_block_(state, '缺少總覽資料列，無法產生文件。');
    return {
      hasRows: false,
      finalScore: null
    };
  }

  var finalRow = overviewRows[overviewRows.length - 1];
  var finalScore = Parser_number_(finalRow && finalRow.actualScore);
  if (!Validator_scoresEqual_(finalScore, 100)) {
    state.messages.push('總覽總分目前為 ' + finalScore + '，建議調整為 100 分後再送出。');
  }

  return {
    hasRows: true,
    finalScore: finalScore
  };
}

function Validator_checkDetailRows_(state, detailRows) {
  if (!Array.isArray(detailRows) || detailRows.length === 0) {
    Validator_block_(state, '缺少明細資料列，無法產生文件。');
    return {
      hasRows: false,
      hasExamTotal: false,
      examScore: null
    };
  }

  Validator_checkDetailQuestionTypes_(state, detailRows);

  var examTotal = Validator_findExamTotalRow_(detailRows);
  if (!examTotal) {
    state.messages.push('缺少明細總計列，仍可產生，但請確認各題型分數合計。');
    return {
      hasRows: true,
      hasExamTotal: false,
      examScore: null
    };
  }

  var examScore = Parser_number_(examTotal.subtotalScore);
  if (!Validator_scoresEqual_(examScore, 100)) {
    state.messages.push('明細總分目前為 ' + examScore + '，建議調整為 100 分後再送出。');
  }

  return {
    hasRows: true,
    hasExamTotal: true,
    examScore: examScore
  };
}

function Validator_checkDetailQuestionTypes_(state, detailRows) {
  for (var i = 0; i < detailRows.length; i += 1) {
    var row = detailRows[i];
    if (row && row.rowKind === 'detail' && !Validator_hasText_(row.questionType)) {
      Validator_block_(state, '明細第 ' + (i + 1) + ' 列缺少題型，請補齊後再產生文件。');
    }
  }
}

function Validator_checkCrossTotals_(state, overviewState, detailState) {
  if (!overviewState.hasRows || !detailState.hasExamTotal) {
    return;
  }
  if (!Validator_scoresEqual_(overviewState.finalScore, detailState.examScore)) {
    state.messages.push(
      '總覽總分 ' + overviewState.finalScore +
      ' 與明細總分 ' + detailState.examScore +
      ' 不一致，請確認兩張表的合計。'
    );
  }
}

function Validator_findExamTotalRow_(detailRows) {
  for (var i = detailRows.length - 1; i >= 0; i -= 1) {
    if (detailRows[i] && detailRows[i].rowKind === 'examTotal') {
      return detailRows[i];
    }
  }
  return null;
}

function Validator_block_(state, message) {
  state.canGenerate = false;
  state.messages.push(message);
}

function Validator_hasText_(value) {
  return String(value == null ? '' : value).trim() !== '';
}

function Validator_scoresEqual_(left, right) {
  return Math.abs(Parser_number_(left) - Parser_number_(right)) < 0.0001;
}

function esc(v) {

    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

window.addEventListener('load', function () {
  byId('exampleBtn').addEventListener('click', function () {
    byId('sourceInput').value = EXAMPLE_MD;
  });
  byId('parseBtn').addEventListener('click', handleParse);
  byId('downloadBtn').addEventListener('click', handleDownload);
});

function handleParse() {
  var text = byId('sourceInput').value.trim();
  if (!text) { alert('請先貼入內容。'); return; }
  var msgBox = byId('messages');
  msgBox.innerHTML = '';
  try {
    var workbook = Parser_parsePayload({ mode: 'unit', inputType: 'markdown', sourceText: text });
    var validation = Validator_validateWorkbook(workbook);
    appState.workbook = workbook;
    msgBox.innerHTML = (validation.messages || []).map(function (m) {
      return '<div class="warn">' + esc(m) + '</div>';
    }).join('');
    renderOverview(workbook.overviewRows);
    renderDetail(workbook.detailRows);
    byId('previewPanel').hidden = false;
  } catch (e) {
    msgBox.innerHTML = '<div class="errmsg">' + esc(e.message) + '</div>';
    byId('previewPanel').hidden = false;
  }
}

var OV_HEADERS = ['單元/課別', '教學目標', '上課節數', '理想配分', '實際配分'];
var OV_KEYS    = ['contentName', 'teachingGoal', 'periods', 'idealScore', 'actualScore'];
var DT_HEADERS = ['教材內容', '試題型式', '記憶題數', '記憶配分', '了解題數', '了解配分', '應用題數', '應用配分', '高層次題數', '高層次配分', '小計題數', '小計配分'];
var DT_KEYS    = ['contentName', 'questionType', 'memoryCount', 'memoryScore', 'understandCount', 'understandScore', 'applyCount', 'applyScore', 'higherCount', 'higherScore', 'subtotalCount', 'subtotalScore'];

function renderOverview(rows) {
  byId('overviewEditor').innerHTML = buildTable('ov', OV_HEADERS, OV_KEYS, rows);
}
function renderDetail(rows) {
  byId('detailEditor').innerHTML = buildTable('dt', DT_HEADERS, DT_KEYS, rows);
}

function buildTable(prefix, headers, keys, rows) {
  var html = '<table><thead><tr>';
  headers.forEach(function (h) { html += '<th>' + esc(h) + '</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach(function (row, ri) {
    html += '<tr>';
    keys.forEach(function (key) {
      var v = row[key] == null ? '' : row[key];
      html += '<td><input data-p="' + prefix + '" data-r="' + ri + '" data-k="' + key + '" value="' + esc(v) + '"></td>';
    });
    html += '</tr>';
  });
  return html + '</tbody></table>';
}

function syncEdits() {
  document.querySelectorAll('[data-p="ov"]').forEach(function (inp) {
    appState.workbook.overviewRows[+inp.dataset.r][inp.dataset.k] = inp.value;
  });
  document.querySelectorAll('[data-p="dt"]').forEach(function (inp) {
    appState.workbook.detailRows[+inp.dataset.r][inp.dataset.k] = inp.value;
  });
}

// ── DOCX 產生 ────────────────────────────────────────────
var UNITS     = 6;
var TYPES_PER = 6;
// 欄位順序：配分(_s)在前、題數(_n)在後（配合 DOCX 實際欄位順序）
var COG_KEYS  = [['memoryScore','memoryCount'],['understandScore','understandCount'],
                 ['applyScore','applyCount'],['higherScore','higherCount']];
var COG_PFX   = ['mem','und','app','hig'];

function buildTemplateVars(workbook) {
  var meta = workbook.meta || {};
  var vars = {
    subject: meta.subject || '',
    grade:   meta.grade   || '',
    teacher: meta.teacher || '',
    version: meta.publisherVersion || ''
  };

  // 表格一：overview_rows 迴圈（排除合計列）
  vars.overview_rows = (workbook.overviewRows || [])
    .filter(function (r) { return r.contentName && r.contentName !== '合計'; })
    .map(function (r) {
      return {
        unit_name:     String(r.contentName   || ''),
        teaching_goal: String(r.teachingGoal  || ''),
        periods:       String(r.periods       || ''),
        ideal_score:   String(r.idealScore    || ''),
        actual_score:  String(r.actualScore   || '')
      };
    });

  // 表格二：按單元分組
  var groups = [];
  var cur = null;
  (workbook.detailRows || []).forEach(function (row) {
    if (row.rowKind === 'examTotal') return;
    if (row.rowKind === 'contentTotal') {
      if (cur) { cur.subtotal = row; groups.push(cur); cur = null; }
      return;
    }
    if (!cur || (row.contentName && row.contentName !== cur.name)) {
      if (cur) groups.push(cur);
      cur = { name: row.contentName || (cur ? cur.name : ''), rows: [] };
    }
    cur.rows.push(row);
  });
  if (cur) groups.push(cur);

  for (var u = 1; u <= UNITS; u++) {
    var g  = groups[u - 1] || null;
    var up = 'u' + u;
    vars[up + '_name'] = g ? String(g.name || '') : '';
    for (var r = 1; r <= TYPES_PER; r++) {
      var rp  = up + '_r' + r;
      var row = g && g.rows ? g.rows[r - 1] : null;
      vars[rp + '_type'] = row ? String(row.questionType || '') : '';
      // 資料列欄位順序：_s 在前，_n 在後（配合 DOCX 欄位）
      COG_PFX.forEach(function (c, ci) {
        vars[rp + '_' + c + '_s'] = row ? String(row[COG_KEYS[ci][0]] || 0) : '';
        vars[rp + '_' + c + '_n'] = row ? String(row[COG_KEYS[ci][1]] || 0) : '';
      });
      vars[rp + '_tot_s'] = row ? String(row.subtotalScore || 0) : '';
    }
    // 小計列（只有 _s，無 _n 欄）
    var sub = g && g.subtotal ? g.subtotal : null;
    var sp  = up + '_sub';
    COG_PFX.forEach(function (c, ci) {
      vars[sp + '_' + c + '_s'] = sub ? String(sub[COG_KEYS[ci][0]] || 0) : '';
    });
    vars[sp + '_tot_s'] = sub ? String(sub.subtotalScore || 0) : '';
  }

  // 全卷總計（只有 _s，無 _n 欄）
  var exam = (workbook.detailRows || []).find(function (r) { return r.rowKind === 'examTotal'; }) || null;
  COG_PFX.forEach(function (c, ci) {
    vars['exam_' + c + '_s'] = exam ? String(exam[COG_KEYS[ci][0]] || 0) : '';
  });
  vars['exam_tot_s'] = exam ? String(exam.subtotalScore || 0) : '';

  return vars;
}

function mergeDetailUnitCells(zip) {
  var W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  var docXml = zip.files['word/document.xml'].asText();
  var xmlDoc = new DOMParser().parseFromString(docXml, 'application/xml');
  var tables = Array.prototype.slice.call(xmlDoc.getElementsByTagNameNS(W, 'tbl'));
  var detailTable = null;
  for (var ti = 0; ti < tables.length; ti++) {
    var firstRow = tables[ti].getElementsByTagNameNS(W, 'tr')[0];
    if (firstRow && firstRow.getElementsByTagNameNS(W, 'tc').length > 8) {
      detailTable = tables[ti]; break;
    }
  }
  if (!detailTable) return;
  var allRows = Array.prototype.slice.call(detailTable.getElementsByTagNameNS(W, 'tr'));
  var dataRows = allRows.slice(2);
  var inMerge = false;
  dataRows.forEach(function (row) {
    var cells = Array.prototype.slice.call(row.getElementsByTagNameNS(W, 'tc'));
    if (!cells.length) return;
    var fc = cells[0];
    var content = Array.prototype.slice.call(fc.getElementsByTagNameNS(W, 't'))
      .map(function (t) { return t.textContent; }).join('').trim();
    var tcPr = fc.getElementsByTagNameNS(W, 'tcPr')[0];
    if (!tcPr) {
      tcPr = xmlDoc.createElementNS(W, 'w:tcPr');
      fc.insertBefore(tcPr, fc.firstChild);
    }
    Array.prototype.slice.call(tcPr.getElementsByTagNameNS(W, 'vMerge'))
      .forEach(function (vm) { tcPr.removeChild(vm); });
    if (content === '全卷總計') {
      inMerge = false;
    } else if (content) {
      inMerge = true;
      var vm = xmlDoc.createElementNS(W, 'w:vMerge');
      vm.setAttributeNS(W, 'w:val', 'restart');
      tcPr.appendChild(vm);
    } else if (inMerge) {
      var vm = xmlDoc.createElementNS(W, 'w:vMerge');
      tcPr.appendChild(vm);
    }
  });
  zip.file('word/document.xml', new XMLSerializer().serializeToString(xmlDoc));
}

function removeEmptyTableRows(zip) {
  var W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  var docXml = zip.files['word/document.xml'].asText();
  var xmlDoc = new DOMParser().parseFromString(docXml, 'application/xml');
  var rows = Array.prototype.slice.call(xmlDoc.getElementsByTagNameNS(W, 'tr'));
  rows.forEach(function (tr) {
    var texts = Array.prototype.slice.call(tr.getElementsByTagNameNS(W, 't'));
    var content = texts.map(function (t) { return t.textContent; }).join('').trim();
    // 刪除：完全空白的列，或只剩「單元合計」沒有任何數字的列（未使用的預展開列）
    if (!content || content === '單元合計') {
      tr.parentNode.removeChild(tr);
    }
  });
  zip.file('word/document.xml', new XMLSerializer().serializeToString(xmlDoc));
}

function handleDownload() {
  if (!appState.workbook) { alert('請先解析內容。'); return; }
  syncEdits();

  var m = appState.workbook.meta = appState.workbook.meta || {};
  m.subject          = byId('subject').value;
  m.grade            = byId('grade').value;
  m.teacher          = byId('teacher').value;
  m.publisherVersion = byId('version').value;

  var vars = buildTemplateVars(appState.workbook);

  try {
    var binary = atob(TEMPLATE_B64);
    var buf    = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) buf[i] = binary.charCodeAt(i);

    var zip = new PizZip(buf.buffer);
    var templater = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
    templater.setData(vars);
    templater.render();
    var renderedZip = templater.getZip();
    removeEmptyTableRows(renderedZip);
    mergeDetailUnitCells(renderedZip);

    var blob = renderedZip.generate({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
    var url = URL.createObjectURL(blob);
    var a   = document.createElement('a');
    a.href  = url;
    a.download = '雙向細目表_' + (m.subject || '') + '_' + (m.grade || '') + '.docx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('產生 DOCX 失敗：' + (e.message || String(e)));
    console.error(e);
  }
}
